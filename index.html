<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000012;
    }

    h1 {
      text-align: center;
      color: #2563eb;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
    }

    .task-input {
      display: flex;
      gap: 8px;
      margin: 25px 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      padding: 11px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .progress-container {
      margin: 20px 0;
      padding: 15px;
      background: #eff6ff;
      border-radius: 12px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #dbeafe;
      border-radius: 20px;
      overflow: hidden;
    }

    #progressFill {
      width: 0%;
      height: 100%;
      background: #22c55e;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    #taskList {
      list-style: none;
      padding: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    .task-item span {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: #64748b;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty-message {
      text-align: center;
      color: #64748b;
      padding: 15px 0;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎯 Student Task Manager</h1>
    <p class="subtitle">Plan your day. Complete your goals!</p>

    <form class="task-input" id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task..."
        maxlength="200"
        required
      >
      <button type="submit" class="add-btn">+ Add</button>
    </form>

    <div class="progress-container">
      <div class="progress-info">
        <span>📊 Your Progress</span>
        <strong id="progressText">0%</strong>
      </div>

      <div
        class="progress-bar"
        role="progressbar"
        aria-label="Tasks completed"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="progressFill"></div>
      </div>

      <p id="taskCount">0 of 0 tasks completed</p>
    </div>

    <ul id="taskList"></ul>

    <p class="footer">Made with ❤️ for students</p>
  </div>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const taskCount = document.getElementById("taskCount");
    const progressBar = document.querySelector(".progress-bar");

    let tasks = [];

    try {
      const savedTasks = localStorage.getItem("studentTasks");
      tasks = savedTasks ? JSON.parse(savedTasks) : [];

      if (
        !Array.isArray(tasks) ||
        !tasks.every(task =>
          task &&
          typeof task.text === "string" &&
          typeof task.completed === "boolean"
        )
      ) {
        tasks = [];
      }
    } catch (error) {
      tasks = [];
    }

    function saveTasks() {
      try {
        localStorage.setItem("studentTasks", JSON.stringify(tasks));
      } catch (error) {
        alert("Tasks could not be saved on this device.");
      }
    }

    function updateProgress() {
      const total = tasks.length;
      const completed = tasks.filter(
        task => task.completed
      ).length;

      const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      progressText.textContent = percentage + "%";
      progressFill.style.width = percentage + "%";
      progressBar.setAttribute("aria-valuenow", percentage);

      taskCount.textContent =
        completed + " of " + total + " tasks completed";
    }

    function renderTasks() {
      taskList.replaceChildren();

      if (tasks.length === 0) {
        const message = document.createElement("li");
        message.className = "empty-message";
        message.textContent = "No tasks yet. Add your first task! 😊";
        taskList.appendChild(message);
      }

      tasks.forEach((task, index) => {
        const item = document.createElement("li");
        item.className = "task-item";

        if (task.completed) {
          item.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute(
          "aria-label",
          "Mark task complete"
        );

        checkbox.addEventListener("change", function () {
          tasks[index].completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", "Delete task");

        deleteButton.addEventListener("click", function () {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, text, deleteButton);
        taskList.appendChild(item);
      });

      updateProgress();
    }

    taskForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = taskInput.value.trim();

      if (!text) {
        return;
      }

      tasks.push({
        text: text,
        completed: false
      });

      saveTasks();
      taskInput.value = "";
      renderTasks();
      taskInput.focus();
    });

    renderTasks();
  </script>
</body>
</html>
