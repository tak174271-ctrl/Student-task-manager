<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000012;
    }

    h1 {
      text-align: center;
      color: #2563eb;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }

    button {
      border: none;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .theme-btn {
      background: #1e293b;
      color: white;
    }

    .task-input {
      display: flex;
      gap: 8px;
      margin: 25px 0;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: white;
      color: #1e293b;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .progress-container {
      margin: 20px 0;
      padding: 15px;
      background: #eff6ff;
      border-radius: 12px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #dbeafe;
      border-radius: 20px;
      overflow: hidden;
    }

    #progressFill {
      width: 0%;
      height: 100%;
      background: #22c55e;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    #taskList {
      list-style: none;
      padding: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    .task-item span {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: #64748b;
    }

    .edit-btn {
      background: #fef3c7;
      color: #92400e;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty-message {
      text-align: center;
      color: #64748b;
      padding: 15px 0;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 25px;
    }

    body.dark-mode {
      background: #0f172a;
      color: #f1f5f9;
    }

    body.dark-mode .container {
      background: #1e293b;
    }

    body.dark-mode h1 {
      color: #60a5fa;
    }

    body.dark-mode .subtitle,
    body.dark-mode .footer {
      color: #cbd5e1;
    }

    body.dark-mode input[type="text"] {
      background: #334155;
      color: white;
      border-color: #475569;
    }

    body.dark-mode .progress-container {
      background: #334155;
    }

    body.dark-mode .progress-bar {
      background: #475569;
    }

    body.dark-mode .task-item {
      background: #334155;
      border-color: #475569;
    }

    body.dark-mode .task-item.completed span,
    body.dark-mode .empty-message {
      color: #cbd5e1;
    }

    body.dark-mode .delete-btn {
      background: #7f1d1d;
      color: #fecaca;
    }

    body.dark-mode .edit-btn {
      background: #854d0e;
      color: #fef3c7;
    }

    body.dark-mode .theme-btn {
      background: #facc15;
      color: #1e293b;
    }

    @media (max-width: 420px) {
      body {
        padding: 10px;
      }

      .container {
        margin: 10px auto;
        padding: 16px;
      }

      .task-item {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="top-bar">
      <button type="button" id="themeToggle" class="theme-btn">
        🌙 Dark Mode
      </button>
    </div>

    <h1>🎯 Student Task Manager</h1>
    <p class="subtitle">Plan your day. Complete your goals!</p>

    <form class="task-input" id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task..."
        maxlength="200"
        required
      >
      <button type="submit" class="add-btn" id="submitBtn">
        + Add
      </button>
    </form>

    <div class="progress-container">
      <div class="progress-info">
        <span>📊 Your Progress</span>
        <strong id="progressText">0%</strong>
      </div>

      <div
        class="progress-bar"
        role="progressbar"
        aria-label="Tasks completed"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="progressFill"></div>
      </div>

      <p id="taskCount">0 of 0 tasks completed</p>
    </div>

    <ul id="taskList"></ul>

    <p class="footer">Made with ❤️ for students</p>
  </div>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const submitBtn = document.getElementById("submitBtn");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const taskCount = document.getElementById("taskCount");
    const progressBar = document.querySelector(".progress-bar");
    const themeToggle = document.getElementById("themeToggle");

    let tasks = [];
    let editingIndex = null;

    try {
      const savedTasks = localStorage.getItem("studentTasks");
      const parsedTasks = savedTasks ? JSON.parse(savedTasks) : [];

      if (
        Array.isArray(parsedTasks) &&
        parsedTasks.every(task =>
          task &&
          typeof task.text === "string" &&
          typeof task.completed === "boolean"
        )
      ) {
        tasks = parsedTasks;
      }
    } catch (error) {
      tasks = [];
    }

    function saveTasks() {
      try {
        localStorage.setItem(
          "studentTasks",
          JSON.stringify(tasks)
        );
      } catch (error) {
        alert("Tasks could not be saved on this device.");
      }
    }

    function updateProgress() {
      const total = tasks.length;
      const completed = tasks.filter(
        task => task.completed
      ).length;

      const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      progressText.textContent = percentage + "%";
      progressFill.style.width = percentage + "%";
      progressBar.setAttribute("aria-valuenow", percentage);

      taskCount.textContent =
        completed + " of " + total + " tasks completed";
    }

    function cancelEdit() {
      editingIndex = null;
      taskInput.value = "";
      submitBtn.textContent = "+ Add";
    }

    function renderTasks() {
      taskList.replaceChildren();

      if (tasks.length === 0) {
        const message = document.createElement("li");
        message.className = "empty-message";
        message.textContent =
          "No tasks yet. Add your first task! 😊";
        taskList.appendChild(message);
      }

      tasks.forEach((task, index) => {
        const item = document.createElement("li");
        item.className = "task-item";

        if (task.completed) {
          item.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute(
          "aria-label",
          "Mark task complete"
        );

        checkbox.addEventListener("change", function () {
          tasks[index].completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "edit-btn";
        editButton.textContent = "✏️ Edit";

        editButton.addEventListener("click", function () {
          editingIndex = index;
          taskInput.value = tasks[index].text;
          submitBtn.textContent = "💾 Update";
          taskInput.focus();
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function () {
          tasks.splice(index, 1);

          if (editingIndex === index) {
            cancelEdit();
          } else if (
            editingIndex !== null &&
            editingIndex > index
          ) {
            editingIndex--;
          }

          saveTasks();
          renderTasks();
        });

        item.append(
          checkbox,
          text,
          editButton,
          deleteButton
        );

        taskList.appendChild(item);
      });

      updateProgress();
    }

    taskForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = taskInput.value.trim();

      if (!text) {
        return;
      }

      if (editingIndex !== null) {
        tasks[editingIndex].text = text;
        cancelEdit();
      } else {
        tasks.push({
          text: text,
          completed: false
        });

        taskInput.value = "";
      }

      saveTasks();
      renderTasks();
    });

    taskInput.addEventListener("input", function () {
      if (
        editingIndex !== null &&
        taskInput.value.trim() === ""
      ) {
        submitBtn.textContent = "💾 Update";
      }
    });

    function applyTheme(isDark) {
      document.body.classList.toggle("dark-mode", isDark);

      themeToggle.textContent = isDark
        ? "☀️ Light Mode"
        : "🌙 Dark Mode";

      themeToggle.setAttribute(
        "aria-pressed",
        String(isDark)
      );
    }

    let isDark = false;

    try {
      isDark = localStorage.getItem("studentTheme") === "dark";
    } catch (error) {
      isDark = false;
    }

    applyTheme(isDark);

    themeToggle.addEventListener("click", function () {
      isDark = !document.body.classList.contains("dark-mode");
      applyTheme(isDark);

      try {
        localStorage.setItem(
          "studentTheme",
          isDark ? "dark" : "light"
        );
      } catch (error) {
        // Theme still works until refresh.
      }
    });

    renderTasks();
  </script>
</body>
</html>
