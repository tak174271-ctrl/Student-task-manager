<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            transition: 0.3s;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
        }

        .top-buttons {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 13px;
            cursor: pointer;
            font-size: 14px;
            margin: 3px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            width: 100%;
            padding: 13px;
            font-size: 16px;
        }

        .theme-btn {
            background: #334155;
            color: white;
        }

        .progress-box {
            margin-top: 22px;
        }

        .progress-track {
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: width 0.3s;
        }

        #taskList {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px;
            margin-bottom: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
        }

        .task input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .task-text {
            flex: 1;
            min-width: 100px;
            overflow-wrap: anywhere;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        #message {
            text-align: center;
            color: #64748b;
            margin-top: 20px;
        }

        body.dark {
            background: #0f172a;
            color: #e2e8f0;
        }

        body.dark .container {
            background: #1e293b;
        }

        body.dark .task {
            background: #334155;
            border-color: #475569;
        }

        body.dark input[type="text"] {
            background: #334155;
            color: white;
            border-color: #64748b;
        }

        body.dark .subtitle {
            color: #cbd5e1;
        }

        body.dark .progress-track {
            background: #475569;
        }

        @media (max-width: 450px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
                margin-top: 15px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="top-buttons">
            <button class="theme-btn" id="themeButton" type="button">
                🌙 Dark Mode
            </button>
        </div>

        <h1>🎓 Student Task Manager</h1>
        <p class="subtitle">Manage your daily study tasks easily!</p>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your study task..."
                maxlength="200"
                required
            >

            <button class="add-btn" id="submitButton" type="submit">
                + Add Task
            </button>

            <button
                id="cancelButton"
                type="button"
                style="display:none; width:100%; background:#64748b; color:white;"
            >
                Cancel Edit
            </button>
        </form>

        <div class="progress-box">
            <strong>Study Progress: <span id="progressText">0%</span></strong>
            <div class="progress-track">
                <div id="progressBar"></div>
            </div>
            <p id="taskCount">0 tasks</p>
        </div>

        <ul id="taskList"></ul>
        <p id="message">No tasks yet. Add your first task!</p>
    </div>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const submitButton = document.getElementById("submitButton");
        const cancelButton = document.getElementById("cancelButton");
        const taskList = document.getElementById("taskList");
        const message = document.getElementById("message");
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");
        const taskCount = document.getElementById("taskCount");
        const themeButton = document.getElementById("themeButton");

        let tasks = [];
        let editingId = null;

        try {
            const savedTasks = JSON.parse(
                localStorage.getItem("studentTasks")
            );

            if (Array.isArray(savedTasks)) {
                tasks = savedTasks.filter(
                    task => task &&
                    typeof task.text === "string"
                ).map((task, index) => ({
                    id: task.id ?? Date.now() + index,
                    text: task.text,
                    completed: Boolean(task.completed)
                }));
            }
        } catch (error) {
            tasks = [];
        }

        if (localStorage.getItem("studentTheme") === "dark") {
            document.body.classList.add("dark");
            themeButton.textContent = "☀️ Light Mode";
        }

        function saveTasks() {
            localStorage.setItem("studentTasks", JSON.stringify(tasks));
        }

        function renderTasks() {
            taskList.innerHTML = "";

            tasks.forEach(function(task) {
                const li = document.createElement("li");
                li.className = "task";

                if (task.completed) {
                    li.classList.add("completed");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.setAttribute("aria-label", "Complete task");

                checkbox.addEventListener("change", function() {
                    task.completed = checkbox.checked;
                    saveTasks();
                    renderTasks();
                });

                const span = document.createElement("span");
                span.className = "task-text";
                span.textContent = task.text;

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "edit-btn";
                editButton.textContent = "✏️ Edit";

                editButton.addEventListener("click", function() {
                    editingId = task.id;
                    taskInput.value = task.text;
                    submitButton.textContent = "Update Task";
                    cancelButton.style.display = "block";
                    taskInput.focus();
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "🗑️ Delete";

                deleteButton.addEventListener("click", function() {
                    tasks = tasks.filter(item => item.id !== task.id);

                    if (editingId === task.id) {
                        cancelEdit();
                    }

                    saveTasks();
                    renderTasks();
                });

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(editButton);
                li.appendChild(deleteButton);

                taskList.appendChild(li);
            });

            const completed = tasks.filter(
                task => task.completed
            ).length;

            const percentage = tasks.length
                ? Math.round((completed / tasks.length) * 100)
                : 0;

            progressBar.style.width = percentage + "%";
            progressText.textContent = percentage + "%";
            taskCount.textContent =
                completed + " completed out of " + tasks.length + " tasks";

            message.style.display = tasks.length ? "none" : "block";
        }

        function cancelEdit() {
            editingId = null;
            taskInput.value = "";
            submitButton.textContent = "+ Add Task";
            cancelButton.style.display = "none";
        }

        taskForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const text = taskInput.value.trim();

            if (!text) {
                return;
            }

            if (editingId !== null) {
                const task = tasks.find(
                    item => item.id === editingId
                );

                if (task) {
                    task.text = text;
                }

                cancelEdit();
            } else {
                tasks.push({
                    id: Date.now(),
                    text: text,
                    completed: false
                });

                taskInput.value = "";
            }

            saveTasks();
            renderTasks();
        });

        cancelButton.addEventListener("click", cancelEdit);

        themeButton.addEventListener("click", function() {
            document.body.classList.toggle("dark");

            const isDark = document.body.classList.contains("dark");

            themeButton.textContent = isDark
                ? "☀️ Light Mode"
                : "🌙 Dark Mode";

            localStorage.setItem(
                "studentTheme",
                isDark ? "dark" : "light"
            );
        });

        renderTasks();
    </script>
</body>
</html>
